name: Build web dist

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm install
        run: npm ci

      - name: Build production web
        run: npm run build:prod

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: wie-web-dist
          path: wie-web/dist
          if-no-files-found: error

      # Publish the built site to the `dist` branch so it can be deployed without
      # downloading artifacts or running the WASM toolchain locally.
      - name: Publish dist branch
        run: |
          cd wie-web/dist
          git init -q
          git checkout -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "web build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
